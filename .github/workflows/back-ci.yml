name: Back-end CI

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - '.github/workflows/back-ci.yml'
  pull_request:
    paths:
      - 'back/**'
      - '.github/workflows/back-ci.yml'

permissions:
  contents: read

concurrency:
  group: back-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Banco descartável para os testes de integração (criado e destruído a cada execução).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sefiteam
          POSTGRES_PASSWORD: sefiteam
          POSTGRES_DB: sefiteam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sefiteam -d sefiteam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: back

    env:
      # Banco de teste (service acima). As migrations são aplicadas pelo vitest.global-setup.ts.
      DATABASE_URL: postgresql://sefiteam:sefiteam@127.0.0.1:5432/sefiteam_test?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: back/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Testes (Vitest)
        run: npm test

      - name: Build
        run: npm run build
